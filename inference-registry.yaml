# Backend registry — the router reads this; never hard-code routing.
# GENERATED by `./dev sync` from services/*/service.py — never hand-edit.
# Resources and images live in each service's service.py manifest.
backends:
  house-price-reg:
    path: services/inference
    tier: standard
    target: cpu
    max_replicas: 3
    scale_to_zero: true
  llm-sim:
    path: services/llm
    tier: realtime
    target: cpu
    max_replicas: 3
    scale_to_zero: true
    engine: max
    model_id: google/gemma-3-12b-it
    cold_start_s: 8.0
    kv_ttl_s: 300.0
  qwen3-8b:
    path: services/qwen3_8b
    tier: realtime
    target: gpu
    max_replicas: 4
    scale_to_zero: true
    engine: vllm
    model_id: Qwen/Qwen3-8B
    cold_start_s: 25.0
    kv_ttl_s: 300.0

# Infrastructure services: built and smoke-tested by the same CI matrix,
# but never routing targets.
services:
  router:
    path: services/router
    tier: realtime
    target: cpu
    max_replicas: 3
    scale_to_zero: false
