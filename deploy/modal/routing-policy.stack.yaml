# Routing policy for the Modal-hosted demo stack (deploy/modal/router_stack.py):
# all four processes live in one container; the router is the only public port.
tiers:
  # voice SLO of record: TTFT p99 < 500 ms, TPOT p99 < 60 ms
  realtime: {max_latency_ms: 30000, prefer: lowest_latency, ttft_ms: 500, tpot_ms: 60}
  standard: {max_latency_ms: 30000, prefer: lowest_cost}
  batch: {max_latency_ms: null, prefer: lowest_cost, queue: true}
cost_table: {frontier-api: 10.0, shadow-candidate: 0.5}
cache: {enabled: false}
affinity: {enabled: false, prefix_tokens: 32, capacity: 8}
routes:
  voice-agent:
    shadow_candidate: http://127.0.0.1:8113/v1
    shadow_id: voice-agent-candidate
    shadow_provider: shadow-candidate
endpoints:
  voice-agent:
    - {id: frontier, provider: frontier-api, url: "http://127.0.0.1:8112"}
