openapi: 3.0.3
info:
  title: LLM Inference Contract (OpenAI-compatible)
  version: "1.0"
  description: >
    The chat surface every LLM backend in this monorepo implements, mirroring
    the OpenAI / MAX `max serve` API so existing clients work unchanged. This is
    additive to contracts/inference.openapi.yaml (/healthz, /v1/info stay); the
    legacy /v1/predict remains for non-LLM backends. The router proxies these
    endpoints and is the only public entrypoint.
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: healthz
      responses:
        "200":
          description: alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok, down]}
  /v1/info:
    get:
      summary: Identity, routing metadata, and LLM capabilities
      operationId: info
      responses:
        "200":
          description: identity
          content:
            application/json:
              schema:
                type: object
                required: [model, version, tier, target]
                properties:
                  model: {type: string}
                  version: {type: string}
                  tier: {type: string, enum: [realtime, standard, batch]}
                  target: {type: string, enum: [cpu, gpu]}
                  engine: {type: string, enum: [max, sklearn]}
                  capabilities:
                    type: array
                    items: {type: string, enum: [chat, predict]}
  /v1/models:
    get:
      summary: List served models (OpenAI shape)
      operationId: listModels
      responses:
        "200":
          description: model list
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: {type: string, enum: [list]}
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        object: {type: string, enum: [model]}
  /v1/chat/completions:
    post:
      summary: Create a chat completion (streaming or not)
      operationId: chatCompletions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: {type: string}
                messages:
                  type: array
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: {type: string, enum: [system, user, assistant]}
                      content: {type: string}
                max_tokens: {type: integer, default: 64}
                stream: {type: boolean, default: false}
                seed: {type: integer, nullable: true}
      responses:
        "200":
          description: >
            Non-streaming: a chat.completion object. Streaming (stream=true):
            text/event-stream of chat.completion.chunk objects terminated by
            `data: [DONE]`. Both carry economics headers: X-Cache,
            X-TTFT-Ms, X-Tokens-Per-Sec, X-Est-Cost.
          content:
            application/json:
              schema:
                type: object
                required: [id, object, choices, usage]
                properties:
                  id: {type: string}
                  object: {type: string, enum: [chat.completion]}
                  model: {type: string}
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        index: {type: integer}
                        message:
                          type: object
                          properties:
                            role: {type: string}
                            content: {type: string}
                        finish_reason: {type: string}
                  usage:
                    type: object
                    properties:
                      prompt_tokens: {type: integer}
                      completion_tokens: {type: integer}
                      total_tokens: {type: integer}
            text/event-stream:
              schema: {type: string}
  /v1/predict:
    post:
      summary: Legacy predict (non-LLM backends; see inference.openapi.yaml)
      operationId: predict
      responses:
        "200": {description: model-specific result}
