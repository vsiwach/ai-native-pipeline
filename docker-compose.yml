# Local demo of the full stack: router + sklearn backend + LLM (MAX sim).
#   docker compose up --build
#   # legacy predict via the router:
#   curl -X POST 'localhost:8090/v1/predict?model=house-price-reg' \
#     -H 'token: local-dev-key' -H 'Content-Type: application/json' \
#     -d @services/inference/docs/sample_payload.json
#   # streaming chat straight from the no-GPU MAX simulator:
#   ./dev chat "what is prefill vs decode?" --port 8100 --stream
services:
  inference:
    build:
      context: .
      dockerfile: services/inference/Dockerfile
    environment:
      INFERENCE_API_KEY: local-dev-key
    # internal only — the router is the single public entrypoint

  llm:
    build:
      context: .
      dockerfile: services/llm/Dockerfile
    ports:
      - "8100:8080"   # exposed so you can hit the OpenAI-compatible API directly
    environment:
      ENGINE: max      # max (sim) | sklearn ; flip TARGET=gpu + MAX_BASE_URL for real max serve
      TARGET: cpu
      MODEL_NAME: llm-sim
      COLD_START_S: "8.0"
      KV_TTL_S: "300.0"

  # Certified migration: incumbent + candidate docs-assist
  # instances, same image, different upstream. Both default to the llm sim
  # (`llm` service) so the shadow -> certify -> promote loop runs with no
  # keys/GPU; point UPSTREAM_BASE_URL at a frontier API / MAX pod to go live.
  # Build the KB first: python3 tools/ragindex/build_index.py
  docs-assist:
    build:
      context: .
      dockerfile: services/docs_assist/Dockerfile
    ports:
      - "8103:8080"
    environment:
      UPSTREAM_BASE_URL: ${DOCS_ASSIST_UPSTREAM:-http://llm:8080/v1}
      UPSTREAM_MODEL: ${DOCS_ASSIST_MODEL:-llm-sim}
      KB_INDEX: /srv/kb/modular_kb.sqlite

  docs-assist-candidate:
    build:
      context: .
      dockerfile: services/docs_assist/Dockerfile
    ports:
      - "8104:8080"
    environment:
      UPSTREAM_BASE_URL: ${DOCS_ASSIST_CANDIDATE_UPSTREAM:-http://llm:8080/v1}
      UPSTREAM_MODEL: ${DOCS_ASSIST_CANDIDATE_MODEL:-llm-sim}
      KB_INDEX: /srv/kb/modular_kb.sqlite

  router:
    build:
      context: .
      dockerfile: services/router/Dockerfile
    ports:
      - "8090:8080"
    environment:
      HEALTH_POLL_INTERVAL_S: "5"
    depends_on:
      - inference
      - docs-assist
      - docs-assist-candidate
