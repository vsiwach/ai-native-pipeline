# Routing policy — the router's only decision input besides the registry.
# Ops maintains cost_table; Phase 4's deploy pipeline appends cloud endpoints.
tiers:
  # ttft_ms / tpot_ms are the LLM SLOs (time-to-first-token, time-per-output-
  # token) the router routes and autoscales against.
  # voice SLO of record: TTFT p99<500ms, TPOT p99<60ms
  realtime: {max_latency_ms: 250, prefer: lowest_latency, ttft_ms: 500, tpot_ms: 60}
  standard: {max_latency_ms: 2000, prefer: lowest_cost, ttft_ms: 2000, tpot_ms: 80}
  batch: {max_latency_ms: null, prefer: lowest_cost, queue: true}

cost_table: # $/1M requests, maintained by ops — router just reads it
  gcp-cloudrun-cpu: 0.40
  aws-apprunner-cpu: 0.46
  local-docker: 0.10
  # Certified migration: the incumbent (any OpenAI-compatible endpoint) vs
  # the candidate GPU pool. Ranking values only — REAL $/Mtok is measured by
  # tools/bench.py and served from /v1/costs `pools`.
  frontier-api: 10.00
  shadow-candidate: 0.50

cache: {enabled: true, ttl_s: 300, backend: in_memory} # swap for redis later

# Certified migration: per-route release flags. While a route's primary serves
# the client, the router mirrors each request to shadow_candidate (fire-and-
# forget; failures logged, never surfaced) and appends (request, primary,
# candidate) to shadow-logs/<route>.shadow.jsonl — the evidence
# tools/certify.py scores. POST /v1/routes/<route>/promote swaps the primary
# for the candidate (in-memory); /rollback restores the previous endpoints.
routes:
  docs-assist:
    shadow_candidate: http://docs-assist-candidate:8080/v1
    shadow_id: docs-assist-candidate
    shadow_provider: shadow-candidate

# Stateful KV/prefix-aware routing. consistent_hash keeps a prompt prefix
# landing on the same replica so its KV is a hit, not an expensive prefill;
# on that replica failing, traffic re-lands consistently elsewhere.
affinity: {enabled: true, prefix_tokens: 32, strategy: consistent_hash, capacity: 8}

# Backend endpoints per model. Each entry is a replica: optional `id`
# (defaults to url), a `provider` (a cost_table key), and a `url`.
# deploy/terraform's endpoint sync appends real cloud URLs after apply.
endpoints:
  house-price-reg:
    - provider: local-docker
      url: http://inference:8080
  llm-sim:
    - provider: local-docker
      url: http://llm:8080
  # Certified-migration route: primary is the incumbent docs-assist instance
  # (UPSTREAM_BASE_URL -> frontier API or llm-sim); the candidate instance
  # (UPSTREAM_BASE_URL -> MAX GPU pool) is in `routes:` above until promoted.
  docs-assist:
    - id: frontier
      provider: frontier-api
      url: http://docs-assist:8080
