# Agent governance policy — enforced by tools/policy_check.py.
# CLAUDE.md binds all agents working in this repo to these rules.
#
# Identities matching agent_identities are treated as agents; everyone else
# is a human. Actions not listed here are denied to agents by default.

agent_identities: claude, claude[bot], agent, github-actions[bot]

actions:
  test-gen:
    agent_allowed: true
    paths: "*/tests/**"
    max_files: 10
    trailer: "[agent:test-gen]"
  staging-deploy:
    agent_allowed: true
    requires_ci_green: true
  deploy:
    agent_allowed: true
    allowed_envs: staging
  production-deploy:
    agent_allowed: false
    reason: production deploys are human-only
  container-publish:
    agent_allowed: true
    allowed_refs: refs/heads/main
    reason: agents may publish images only from main, never PR branches
  canary:
    agent_allowed: true
    allowed_envs: staging
    reason: agents may run canary rollouts in staging only
  shadow:
    agent_allowed: true
    allowed_envs: staging
    reason: agents may run shadow (mirror) deploys in staging only
  prod-shift:
    agent_allowed: false
    reason: production traffic shifts are human-only — never unguarded by an agent
  push:
    agent_allowed: true
